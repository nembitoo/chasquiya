# ---------------------------------------------------------------------------
# Integración continua de ChasquiYa!
#
# Corre solo en GitHub: hasta que el proyecto no esté subido, este archivo
# queda listo pero inactivo. No hace falta tocarlo el día que lo subas.
#
# Qué hace en cada push: levanta el mismo entorno de docker-compose que usas
# en tu PC, corre los tests del backend y revisa los tipos de la app.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest

    # Los tests hablan con Postgres de verdad (PostGIS no se puede simular) y
    # el arranque de la aplicación necesita MinIO. Estas variables valen tanto
    # para los contenedores como para Spring Boot.
    env:
      POSTGRES_DB: chasquiya
      POSTGRES_USER: chasquiya
      POSTGRES_PASSWORD: chasquiya_ci
      POSTGRES_PORT: 5432
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_ci_pass
      MINIO_API_PORT: 9000
      MINIO_CONSOLE_PORT: 9001
      MAILPIT_SMTP_PORT: 1025
      MAILPIT_UI_PORT: 8025
      BACKEND_PORT: 8080

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Se reutiliza el docker-compose del proyecto para que el entorno de CI
      # no se separe del local. El .env no está en el repo (y así debe ser),
      # así que se arma aquí con los valores de arriba.
      - name: Levantar Postgres, MinIO y Mailpit
        run: |
          cat > .env <<EOF
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_PORT=$POSTGRES_PORT
          MINIO_ROOT_USER=$MINIO_ROOT_USER
          MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
          MINIO_API_PORT=$MINIO_API_PORT
          MINIO_CONSOLE_PORT=$MINIO_CONSOLE_PORT
          MAILPIT_SMTP_PORT=$MAILPIT_SMTP_PORT
          MAILPIT_UI_PORT=$MAILPIT_UI_PORT
          BACKEND_PORT=$BACKEND_PORT
          EOF
          docker compose up -d --wait

      - name: Tests
        working-directory: backend
        run: ./mvnw --batch-mode test

      - name: Apagar los servicios
        if: always()
        run: docker compose down -v

  app:
    name: App (tipos)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      # TypeScript no compila la app (de eso se encarga Metro), pero sí detecta
      # llamadas a la API con datos que no calzan, que es el error caro.
      - name: Revisar tipos
        working-directory: app
        run: npx tsc --noEmit
