spring.application.name=chasquiya-backend

# --- Puerto del backend ---
# Usa BACKEND_PORT si existe; si no, 8080.
server.port=${BACKEND_PORT:8080}

# --- Conexión a PostgreSQL + PostGIS (Docker) ---
# Cada ${VAR:valor} usa la variable de entorno si está definida,
# y si no, cae en el valor por defecto (que coincide con el .env local).
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:chasquiya}
spring.datasource.username=${POSTGRES_USER:chasquiya}
spring.datasource.password=${POSTGRES_PASSWORD:chasquiya_dev}

# --- JPA / Hibernate ---
# Flyway es el dueño del esquema, así que Hibernate NO crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway (migraciones) ---
# Corre solo las migraciones de src/main/resources/db/migration al arrancar.
spring.flyway.enabled=true

# --- Actuator: expone /actuator/health para chequeos ---
management.endpoints.web.exposure.include=health

# --- Autenticación JWT ---
# El secreto firma los tokens. En producción se pasa por variable de entorno JWT_SECRET.
# El valor por defecto es SOLO para desarrollo local (mín. 32 bytes para HS256).
chasquiya.jwt.secret=${JWT_SECRET:dev-secreto-chasquiya-cambiar-en-produccion-1234567890abcdef}
# Horas de validez del token de acceso.
chasquiya.jwt.expiracion-horas=${JWT_EXP_HORAS:12}

# --- Usuario administrador (se crea al arrancar si no existe) ---
chasquiya.admin.email=${ADMIN_EMAIL:admin@chasquiya.cl}
chasquiya.admin.password=${ADMIN_PASSWORD:admin12345}

# --- Comisión de la plataforma ---
# Se DESCUENTA AL MAESTRO: el cliente paga lo cotizado y la plataforma retiene este %.
chasquiya.comision.porcentaje=${COMISION_PORCENTAJE:10}

# --- MinIO (almacenamiento de documentos) ---
chasquiya.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
chasquiya.minio.access-key=${MINIO_ROOT_USER:minioadmin}
chasquiya.minio.secret-key=${MINIO_ROOT_PASSWORD:minio_dev_pass}
chasquiya.minio.bucket=${MINIO_BUCKET:documentos-maestros}

# Límite de tamaño de archivos subidos.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
