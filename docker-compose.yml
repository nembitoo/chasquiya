# ---------------------------------------------------------------------------
# Chasquiya — entorno local de desarrollo
# Un solo comando levanta todo:  docker compose up -d
# Requiere un archivo .env (créalo copiando .env.example).
# ---------------------------------------------------------------------------

services:
  # --- Base de datos: PostgreSQL + PostGIS (geolocalización) ---
  db:
    image: postgis/postgis:16-3.4
    container_name: chasquiya-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Almacenamiento de fotos: MinIO ("S3 local") ---
  minio:
    image: minio/minio
    container_name: chasquiya-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"      # API (S3)
      - "${MINIO_CONSOLE_PORT}:9001"  # consola web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Correos de prueba: Mailpit (captura SMTP + interfaz web) ---
  mailpit:
    image: axllent/mailpit
    container_name: chasquiya-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"   # SMTP (el backend envía aquí)
      - "${MAILPIT_UI_PORT}:8025"     # interfaz web para leer los correos

volumes:
  db-data:
  minio-data:
